# AWS Deployment Configuration for QuantumHealth AI
# Supports: EC2, Elastic Beanstalk, ECS Fargate, Lambda

service: quantumhealth-ai
region: us-east-1

deployment_options:
  elastic_beanstalk:
    platform: "Docker running on 64bit Amazon Linux 2023"
    instance_type: t3.medium
    health_check_path: /api/v1/health
    environment_variables:
      PORT: 8000

  ecs_fargate:
    cpu: 1024
    memory: 2048
    desired_count: 1
    health_check_path: /api/v1/health
    
  ec2:
    instance_type: t3.medium
    ami: ami-0c02fb55956c7d316  # Amazon Linux 2023
    security_group_ports:
      - 8000
      - 443
      - 80
