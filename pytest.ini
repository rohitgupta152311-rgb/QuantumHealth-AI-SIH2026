[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests/backend backend/tests
pythonpath = backend
addopts = --import-mode=importlib --strict-markers
markers =
    training: fits or trains model state; requires --run-training
    integration: requires existing compatible model artifacts; requires --run-integration
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
