version: 0.0
os: linux
files:
  - source: /
    destination: /home/ec2-user/quantumhealth-ai
hooks:
  AfterInstall:
    - location: scripts/aws/install_dependencies.sh
      timeout: 300
      runas: root
  ApplicationStart:
    - location: scripts/aws/start_server.sh
      timeout: 300
      runas: ec2-user
  ApplicationStop:
    - location: scripts/aws/stop_server.sh
      timeout: 120
      runas: root
