services:
  - type: web
    name: quantumhealth-ai-backend
    runtime: python
    region: oregon
    plan: free
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FIREBASE_ENABLED
        value: "true"
      - key: APP_ENV
        value: production